name: Run database migrations
'on':
  push:
    # develop migrates the Neon dev branch first, production migrates the real database.
    branches: [develop, production]
    paths:
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migrate-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    # Each GitHub environment holds that branch's DATABASE_URL_UNPOOLED (direct connection).
    environment:
      name: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check migrations are additive
        run: npm run check:migrations
      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx drizzle-kit migrate
